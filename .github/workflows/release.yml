# Makes a tagged GitHub release (v2.3.0, v2.4.0 …) whenever the version in package.json changes, with notes written
# from the commits since the last one. Directories of self-hosted apps follow releases to see a project is alive.
# Can also be started by hand: Actions → Release → Run workflow (for the first one).
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create the release, unless this version already has one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.v.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag is already there."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Superstation IPTV ${{ steps.v.outputs.version }}" --generate-notes

  # The Android TV / Fire TV app (tv-apps/android), built and attached to the release as superstation-tv.apk — so it
  # can be downloaded with no tools: releases/latest/download/superstation-tv.apk is always the newest.
  # (Signed with the runner's debug key, so nothing to set up: an older copy has to be removed before installing a
  # newer one. The app only remembers the server's address.)
  apk:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle --no-daemon -p tv-apps/android assembleDebug
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          cp tv-apps/android/app/build/outputs/apk/debug/app-debug.apk superstation-tv.apk
          gh release upload "$tag" superstation-tv.apk --clobber
